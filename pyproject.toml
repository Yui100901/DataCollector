[project]
name = "datacollector"
version = "0.1.0"
description = "AI-driven browser automation runtime powered by Playwright."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "DataCollector Maintainers" }
]
dependencies = [
  "openai>=2.29.0",
  "playwright>=1.45.0",
  "pydantic>=2.12.0",
  "pydantic-ai-slim[openai]",
  "python-dotenv>=1.0.1",
  "typer>=0.12.0",
]

[project.scripts]
dc = "datacollector.cli:app"
datacollector = "datacollector.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datacollector"]

[tool.ruff]
line-length = 100
target-version = "py312"
